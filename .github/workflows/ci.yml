name: CI Pipeline ArteSul

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar estrutura e dependências
        run: |
          echo "Executando verificações de qualidade e testes para o ArteSul Marketplace..."
          # Aqui entram os comandos de teste da sua API/Web conforme o projeto evoluir
          node -v